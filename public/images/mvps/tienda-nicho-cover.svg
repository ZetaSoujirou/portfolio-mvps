<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#27272a" stroke-width="1" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="850" cy="300" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Mockup Window Frame -->
  <g transform="translate(180, 80)">
    <rect width="840" height="515" rx="12" fill="#121215" stroke="#27272a" stroke-width="2" />
    <!-- Window Header -->
    <rect width="840" height="42" rx="12" fill="#18181b" />
    <circle cx="25" cy="21" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="45" cy="21" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="65" cy="21" r="6" fill="#10b981" opacity="0.8" />
    <rect x="260" y="10" width="320" height="22" rx="6" fill="#27272a" />
    <text x="420" y="25" fill="#71717a" font-family="monospace" font-size="11" text-anchor="middle">store.tienda-nicho.local</text>

    <!-- Store UI Content -->
    <!-- Navbar -->
    <rect x="30" y="65" width="120" height="18" rx="4" fill="#27272a" />
    <rect x="680" y="65" width="60" height="18" rx="4" fill="#27272a" />
    <rect x="755" y="62" width="55" height="24" rx="6" fill="url(#cyan-grad)" />

    <!-- Hero banner inside store -->
    <rect x="30" y="105" width="780" height="130" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="55" y="130" width="280" height="24" rx="4" fill="#f4f4f5" />
    <rect x="55" y="165" width="380" height="14" rx="3" fill="#71717a" />
    <rect x="55" y="190" width="120" height="28" rx="6" fill="url(#cyan-grad)" />

    <!-- Product Cards Grid -->
    <!-- Card 1 -->
    <rect x="30" y="255" width="245" height="230" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="45" y="270" width="215" height="120" rx="6" fill="#27272a" />
    <rect x="45" y="405" width="140" height="16" rx="3" fill="#f4f4f5" />
    <rect x="45" y="430" width="80" height="14" rx="3" fill="#06b6d4" />
    <rect x="180" y="445" width="80" height="24" rx="4" fill="#27272a" />

    <!-- Card 2 -->
    <rect x="295" y="255" width="245" height="230" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="310" y="270" width="215" height="120" rx="6" fill="#27272a" />
    <rect x="310" y="405" width="150" height="16" rx="3" fill="#f4f4f5" />
    <rect x="310" y="430" width="85" height="14" rx="3" fill="#06b6d4" />
    <rect x="445" y="445" width="80" height="24" rx="4" fill="#27272a" />

    <!-- Card 3 -->
    <rect x="560" y="255" width="250" height="230" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="575" y="270" width="220" height="120" rx="6" fill="#27272a" />
    <rect x="575" y="405" width="130" height="16" rx="3" fill="#f4f4f5" />
    <rect x="575" y="430" width="75" height="14" rx="3" fill="#06b6d4" />
    <rect x="715" y="445" width="80" height="24" rx="4" fill="#27272a" />
  </g>

  <!-- Sample Badge -->
  <g transform="translate(40, 40)">
    <rect width="185" height="32" rx="16" fill="#18181b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#06b6d4" />
    <text x="32" y="21" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROYECTO DE EJEMPLO</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="900" cy="300" r="200" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(180, 80)">
    <rect width="840" height="515" rx="12" fill="#121215" stroke="#27272a" stroke-width="2" />
    <rect width="840" height="42" rx="12" fill="#18181b" />
    <circle cx="25" cy="21" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="45" cy="21" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="65" cy="21" r="6" fill="#10b981" opacity="0.8" />
    <text x="420" y="26" fill="#71717a" font-family="monospace" font-size="12" text-anchor="middle">ops-pipeline.internal.local</text>

    <!-- Pipeline diagram UI -->
    <!-- Metrics row -->
    <rect x="30" y="65" width="240" height="70" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="50" y="95" fill="#71717a" font-family="system-ui" font-size="12">Jobs Procesados (24h)</text>
    <text x="50" y="122" fill="#f4f4f5" font-family="system-ui" font-size="20" font-weight="bold">148,290</text>

    <rect x="290" y="65" width="240" height="70" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="310" y="95" fill="#71717a" font-family="system-ui" font-size="12">Tasa de Éxito</text>
    <text x="310" y="122" fill="#10b981" font-family="system-ui" font-size="20" font-weight="bold">99.98%</text>

    <rect x="550" y="65" width="260" height="70" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="570" y="95" fill="#71717a" font-family="system-ui" font-size="12">Latencia Promedio</text>
    <text x="570" y="122" fill="#06b6d4" font-family="system-ui" font-size="20" font-weight="bold">42 ms</text>

    <!-- Flow canvas -->
    <rect x="30" y="155" width="780" height="330" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <!-- Node 1: Webhook In -->
    <rect x="60" y="260" width="160" height="75" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="80" y="295" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="bold">Webhook Ingest</text>
    <text x="80" y="315" fill="#71717a" font-family="system-ui" font-size="11">POST /v1/events</text>

    <!-- Connector line -->
    <line x1="220" y1="297" x2="310" y2="297" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Node 2: Queue / Worker -->
    <rect x="310" y="260" width="180" height="75" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="330" y="295" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">BullMQ Redis Queue</text>
    <text x="330" y="315" fill="#71717a" font-family="system-ui" font-size="11">Concurrency: 10</text>

    <!-- Connector line -->
    <line x1="490" y1="297" x2="580" y2="297" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Node 3: Sync Target -->
    <rect x="580" y="260" width="190" height="75" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="600" y="295" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">CRM & ERP Sync</text>
    <text x="600" y="315" fill="#71717a" font-family="system-ui" font-size="11">Status: Healthy</text>
  </g>

  <g transform="translate(40, 40)">
    <rect width="185" height="32" rx="16" fill="#18181b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#06b6d4" />
    <text x="32" y="21" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROYECTO DE EJEMPLO</text>
  </g>
</svg>

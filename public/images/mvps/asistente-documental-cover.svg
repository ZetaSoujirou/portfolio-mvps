<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="950" cy="250" r="220" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(180, 80)">
    <rect width="840" height="515" rx="12" fill="#121215" stroke="#27272a" stroke-width="2" />
    <rect width="840" height="42" rx="12" fill="#18181b" />
    <circle cx="25" cy="21" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="45" cy="21" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="65" cy="21" r="6" fill="#10b981" opacity="0.8" />
    <text x="420" y="26" fill="#71717a" font-family="monospace" font-size="12" text-anchor="middle">rag-assistant.corp.local</text>

    <!-- Sidebar with document list -->
    <rect x="25" y="65" width="220" height="425" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="45" y="85" width="120" height="16" rx="4" fill="#8b5cf6" />
    <rect x="45" y="120" width="180" height="36" rx="6" fill="#27272a" />
    <rect x="45" y="165" width="180" height="36" rx="6" fill="#27272a" />
    <rect x="45" y="210" width="180" height="36" rx="6" fill="#27272a" />

    <!-- Chat main window -->
    <rect x="265" y="65" width="550" height="425" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <!-- User message -->
    <rect x="480" y="95" width="310" height="50" rx="8" fill="#27272a" />
    <rect x="495" y="110" width="260" height="12" rx="3" fill="#f4f4f5" />
    <rect x="495" y="128" width="180" height="10" rx="2" fill="#71717a" />
    <!-- AI Response with citations -->
    <rect x="285" y="165" width="420" height="110" rx="8" fill="#121215" stroke="#8b5cf6" stroke-width="1" />
    <rect x="305" y="185" width="360" height="12" rx="3" fill="#f4f4f5" />
    <rect x="305" y="205" width="340" height="12" rx="3" fill="#f4f4f5" />
    <rect x="305" y="225" width="280" height="12" rx="3" fill="#f4f4f5" />
    <!-- Citation badges -->
    <rect x="305" y="250" width="110" height="18" rx="4" fill="#27272a" />
    <rect x="425" y="250" width="120" height="18" rx="4" fill="#27272a" />

    <!-- Input bar -->
    <rect x="285" y="425" width="510" height="46" rx="8" fill="#27272a" />
    <rect x="735" y="432" width="50" height="32" rx="6" fill="url(#purple-grad)" />
  </g>

  <g transform="translate(40, 40)">
    <rect width="185" height="32" rx="16" fill="#18181b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#06b6d4" />
    <text x="32" y="21" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROYECTO DE EJEMPLO</text>
  </g>
</svg>
